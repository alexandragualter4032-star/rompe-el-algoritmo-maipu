<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rompe el Algoritmo — Colegio San Nicolás de Maipú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-main: #0f0a1a;
  --bg-card: rgba(22, 16, 38, 0.88);
  --primary: #ff2e63;
  --secondary: #08d9d6;
  --accent: #ffe66d;
  --text-main: #f8f9fa;
  --text-muted: #c7c9d9;
  --border-glow: rgba(255, 46, 99, 0.45);
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Space Grotesk', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  color: var(--text-main);
  background: var(--bg-main);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s ease, color 0.3s ease;
}

.hidden {
  display: none !important;
}

/* Top Global Bar */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 1.4rem;
  background: rgba(10, 8, 18, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--border-glow);
}

.top-bar-left,
.top-bar-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.top-bar-center {
  flex: 1;
  max-width: 420px;
}

.level-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(255, 255, 255, 0.08);
  padding: 0.35rem 0.8rem;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 0.92rem;
}

.hud-artist-name {
  color: var(--secondary);
  font-weight: 800;
}

.visibility-meter-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.visibility-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  font-weight: 700;
}

.visibility-bar {
  height: 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.visibility-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  transition: width 0.35s ease;
}

.icon-btn,
.pause-btn {
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  padding: 0.45rem 0.9rem;
  border-radius: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.pause-btn {
  border-color: var(--secondary);
  background: rgba(8, 217, 214, 0.16);
}

.icon-btn:hover,
.pause-btn:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.16);
}

/* Main Container */
.screen-container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
}

/* Buttons */
.primary-btn {
  border: none;
  border-radius: 14px;
  padding: 0.9rem 1.6rem;
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), #ff6b35);
  box-shadow: 0 8px 24px var(--border-glow);
  cursor: pointer;
  transition: transform 0.15s ease, filter 0.2s ease;
}

.primary-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.secondary-btn {
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 14px;
  padding: 0.85rem 1.4rem;
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.08);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
}

.secondary-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  transform: translateY(-1px);
}

/* Home Screen */
.home-screen {
  text-align: center;
  padding-top: 1.5rem;
}

.school-pill {
  display: inline-block;
  padding: 0.45rem 1rem;
  border-radius: 999px;
  background: rgba(8, 217, 214, 0.14);
  border: 1px solid var(--secondary);
  color: var(--secondary);
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.game-title {
  font-family: var(--font-display);
  font-size: clamp(2.4rem, 5vw, 4rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  background: linear-gradient(90deg, #ffffff, var(--secondary), var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.75rem;
}

.game-subtitle {
  max-width: 700px;
  margin: 0 auto 2rem;
  color: var(--text-muted);
  font-size: 1.08rem;
  line-height: 1.55;
}

.home-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 2.5rem;
}

.hero-btn {
  font-size: 1.15rem;
  padding: 1rem 2rem;
}

.infinite-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  border-radius: 14px;
  padding: 0.7rem 1.4rem;
  font-family: var(--font-display);
  font-weight: 800;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  cursor: not-allowed;
}

.infinite-btn small {
  font-weight: 500;
  font-size: 0.78rem;
  opacity: 0.85;
}

.infinite-btn.unlocked {
  cursor: pointer;
  color: #111;
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent), var(--secondary));
}

.campaign-strip {
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 22px;
  padding: 1.4rem;
}

.campaign-strip h3 {
  font-family: var(--font-display);
  margin-bottom: 1rem;
}

.level-chips {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 0.7rem;
}

.level-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.2rem;
  padding: 0.7rem 0.85rem;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-family: var(--font-body);
  cursor: pointer;
  text-align: left;
  transition: transform 0.15s ease, border-color 0.2s ease;
}

.level-chip.open:hover,
.level-chip.done:hover {
  transform: translateY(-2px);
  border-color: var(--secondary);
}

.level-chip.done {
  border-color: rgba(8, 217, 214, 0.55);
  background: rgba(8, 217, 214, 0.12);
}

.level-chip.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.level-chip em {
  font-style: normal;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.1rem 0.45rem;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
}

/* Phase 1 Layout */
.phase1-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 1.5rem;
  align-items: start;
}

@media (max-width: 880px) {
  .phase1-layout {
    grid-template-columns: 1fr;
  }

  .artist-stage-card {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 0.9rem;
    align-items: center;
  }

  .decor-chip {
    grid-column: 1 / -1;
    margin-bottom: 0;
  }

  .artist-photo-frame {
    max-width: 120px;
    margin-bottom: 0;
  }
}

.artist-stage-card {
  background: var(--bg-card);
  border: 2px solid var(--border-glow);
  border-radius: 22px;
  padding: 1.15rem;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
}

.decor-chip {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--secondary);
  margin-bottom: 0.75rem;
}

.artist-photo-frame {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.15);
  margin-bottom: 0.9rem;
}

.artist-photo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.artist-meta h2 {
  font-family: var(--font-display);
  font-size: 1.65rem;
  margin-bottom: 0.2rem;
}

.artist-origin {
  color: var(--secondary);
  font-size: 0.88rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.artist-tagline {
  color: var(--text-muted);
  font-size: 0.92rem;
  line-height: 1.45;
  margin-bottom: 0.8rem;
}

.symbol-row {
  display: flex;
  gap: 0.5rem;
  font-size: 1.35rem;
}

.question-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.maipu-spotlight {
  background: linear-gradient(90deg, rgba(255, 46, 99, 0.28), rgba(8, 217, 214, 0.25));
  border: 1px solid var(--secondary);
  border-radius: 14px;
  padding: 0.7rem 1rem;
  font-weight: 700;
  font-size: 0.95rem;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.q-counter {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--secondary);
}

.q-no-timer {
  font-size: 0.86rem;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.08);
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
}

.context-box,
.question-box,
.wildcards-bar {
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 20px;
  padding: 1.2rem 1.35rem;
}

.context-box {
  border-left: 5px solid var(--secondary);
}

.box-label {
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--secondary);
  margin-bottom: 0.4rem;
}

.context-box p {
  line-height: 1.55;
  font-size: 1rem;
}

.extra-hint {
  margin-top: 0.75rem;
  padding: 0.6rem 0.85rem;
  border-radius: 10px;
  background: rgba(255, 230, 109, 0.14);
  border: 1px solid var(--accent);
  font-size: 0.9rem;
}

.question-box h3 {
  font-family: var(--font-display);
  font-size: 1.22rem;
  line-height: 1.38;
  margin-bottom: 0.85rem;
}

.active-buffs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.65rem;
}

.buff-pill {
  font-size: 0.82rem;
  font-weight: 700;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  background: rgba(255, 230, 109, 0.2);
  border: 1px solid var(--accent);
  color: var(--accent);
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.option-btn {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  text-align: left;
  padding: 0.85rem 1rem;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 0.98rem;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
}

.option-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.13);
  border-color: var(--secondary);
  transform: translateX(3px);
}

.opt-letter {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  background: rgba(255, 255, 255, 0.12);
}

.option-btn.correct {
  background: rgba(46, 196, 182, 0.28);
  border-color: #2ec4b6;
}

.option-btn.wrong {
  background: rgba(230, 57, 70, 0.28);
  border-color: #e63946;
  color: #ffb3ba;
  cursor: not-allowed;
}

.option-btn.eliminated {
  opacity: 0.3;
  text-decoration: line-through;
  cursor: not-allowed;
}

.q-feedback {
  margin-top: 0.9rem;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
}

.q-feedback.success {
  background: rgba(46, 196, 182, 0.22);
  border: 1px solid #2ec4b6;
}

.q-feedback.retry {
  background: rgba(255, 159, 28, 0.22);
  border: 1px solid #ff9f1c;
}

.q-feedback.info {
  background: rgba(86, 207, 225, 0.2);
  border: 1px solid #56cfe1;
}

/* Wildcards */
.wildcards-title {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 0.65rem;
}

.wildcards-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.7rem;
}

@media (max-width: 640px) {
  .wildcards-grid {
    grid-template-columns: 1fr;
  }
}

.wildcard-btn {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.7rem 0.85rem;
  border-radius: 14px;
  border: 1px solid var(--secondary);
  background: rgba(8, 217, 214, 0.14);
  color: var(--text-main);
  text-align: left;
  cursor: pointer;
  font-family: var(--font-body);
  transition: transform 0.15s ease;
}

.wildcard-btn.ready:hover:not(:disabled) {
  transform: translateY(-2px);
  background: rgba(8, 217, 214, 0.24);
}

.wildcard-btn.charging,
.wildcard-btn.used {
  opacity: 0.52;
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  cursor: not-allowed;
}

.wc-icon {
  font-size: 1.4rem;
}

.wc-text {
  display: flex;
  flex-direction: column;
}

.wc-text strong {
  font-size: 0.92rem;
}

.wc-text small {
  font-size: 0.76rem;
  color: var(--text-muted);
}

/* DVD Floating Layer */
.dvd-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 35;
}

.dvd-face-btn {
  position: absolute;
  top: 0;
  left: 0;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 3px solid var(--dvd-aura, #08d9d6);
  background: rgba(15, 10, 26, 0.85);
  padding: 4px;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 0 22px var(--dvd-aura, #08d9d6);
  animation: dvdPulse 2.2s ease-in-out infinite;
}

@keyframes dvdPulse {
  0%, 100% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.25);
  }
}

.dvd-face-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.dvd-badge {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dvd-aura, #08d9d6);
  color: #111;
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 900;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}

/* Phase 2 Rhythm */
.phase2-layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 1.5rem;
  align-items: start;
}

@media (max-width: 820px) {
  .phase2-layout {
    grid-template-columns: 1fr;
  }
}

.rhythm-sidebar {
  background: var(--bg-card);
  border: 2px solid var(--border-glow);
  border-radius: 22px;
  padding: 1.2rem;
}

.rhythm-art-box {
  width: 140px;
  height: 140px;
  margin: 0 auto 0.8rem;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid var(--secondary);
}

.rhythm-art-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rhythm-sidebar h3 {
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.45rem;
}

.rhythm-song-tag {
  text-align: center;
  color: var(--secondary);
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.rhythm-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.stat-box {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 0.55rem;
  text-align: center;
}

.stat-box span {
  display: block;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.stat-box strong {
  font-family: var(--font-display);
  font-size: 1.2rem;
}

.approval-box {
  margin-bottom: 0.9rem;
}

.approval-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  font-weight: 700;
  margin-bottom: 0.3rem;
}

.approval-bar {
  position: relative;
  height: 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}

.approval-fill {
  height: 100%;
  transition: width 0.2s ease, background 0.2s ease;
}

.approval-fill.passing {
  background: #2ec4b6;
}

.approval-fill.failing {
  background: #e63946;
}

.approval-target-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #ffffff;
}

.song-time-wrap {
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
  text-align: center;
}

.r-feedback-banner {
  text-align: center;
  padding: 0.65rem;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.92rem;
  background: rgba(255, 255, 255, 0.08);
}

.r-feedback-banner.good {
  background: rgba(46, 196, 182, 0.24);
  color: #80ffdb;
}

.r-feedback-banner.bad {
  background: rgba(230, 57, 70, 0.28);
  color: #ffb3ba;
}

.rhythm-board-wrap {
  position: relative;
  background: var(--bg-card);
  border: 2px solid var(--border-glow);
  border-radius: 22px;
  padding: 1rem;
}

.rhythm-countdown {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: grid;
  place-items: center;
  background: rgba(10, 8, 18, 0.72);
  border-radius: 20px;
  font-family: var(--font-display);
  font-size: 4rem;
  font-weight: 900;
  color: var(--accent);
}

.rhythm-track {
  position: relative;
  width: 100%;
  background: rgba(0, 0, 0, 0.42);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.hit-zone-bar {
  position: absolute;
  left: 0;
  right: 0;
  height: 44px;
  background: rgba(255, 255, 255, 0.08);
  border-top: 2px solid rgba(255, 255, 255, 0.35);
  border-bottom: 2px solid rgba(255, 255, 255, 0.35);
  pointer-events: none;
}

.lanes-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 100%;
}

.lane {
  position: relative;
  border-right: 1px solid rgba(255, 255, 255, 0.1);
  transition: background 0.12s ease;
}

.lane:last-child {
  border-right: none;
}

.lane.error-flash {
  background: rgba(230, 57, 70, 0.35);
}

.lane-notes {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.rhythm-note {
  position: absolute;
  left: 14%;
  width: 72%;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1rem;
  color: #111;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}

.lane-color-0 { background: #ff4d6d; color: #fff; }
.lane-color-1 { background: #08d9d6; }
.lane-color-2 { background: #ffe66d; }
.lane-color-3 { background: #b565ff; color: #fff; }

.lane-receptor {
  position: absolute;
  bottom: 12px;
  left: 10%;
  width: 80%;
  padding: 0.45rem 0;
  border-radius: 12px;
  border: 2px solid rgba(255, 255, 255, 0.32);
  background: rgba(20, 20, 35, 0.85);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lane-receptor .key-cap {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.1rem;
}

.lane-receptor small {
  font-size: 0.68rem;
  opacity: 0.75;
}

.lane-receptor.hit-flash {
  border-color: #2ec4b6;
  background: rgba(46, 196, 182, 0.45);
}

.lane-receptor.error-flash {
  border-color: #e63946;
  background: rgba(230, 57, 70, 0.55);
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(6, 4, 14, 0.82);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  padding: 1rem;
}

.modal-card {
  width: 100%;
  max-width: 560px;
  background: #171226;
  border: 2px solid var(--secondary);
  border-radius: 24px;
  padding: 1.7rem;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  text-align: center;
}

.modal-badge,
.wildcard-badge {
  display: inline-block;
  padding: 0.3rem 0.9rem;
  border-radius: 999px;
  background: rgba(8, 217, 214, 0.16);
  color: var(--secondary);
  font-weight: 800;
  font-size: 0.82rem;
  margin-bottom: 0.8rem;
}

.modal-card h2 {
  font-family: var(--font-display);
  font-size: 1.65rem;
  margin-bottom: 0.9rem;
}

.modal-body {
  text-align: left;
  color: var(--text-muted);
  line-height: 1.55;
  margin-bottom: 1.4rem;
}

.explain-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.explain-list li {
  background: rgba(255, 255, 255, 0.05);
  padding: 0.65rem 0.9rem;
  border-radius: 12px;
  color: var(--text-main);
}

.fact-text {
  font-size: 1.12rem;
  color: var(--text-main);
  text-align: center;
  background: rgba(255, 255, 255, 0.06);
  padding: 1rem;
  border-radius: 14px;
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  margin-top: 1.2rem;
}

/* Wildcard Minigames */
.mg-timer-bar {
  height: 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
  margin: 0.85rem 0 1rem;
}

.mg-timer-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
}

.mg-arena {
  min-height: 170px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 16px;
  padding: 0.9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.mg-drop-zone {
  position: relative;
  width: 100%;
  height: 140px;
}

.mg-falling-icon {
  position: absolute;
  font-size: 2rem;
  background: rgba(255, 255, 255, 0.14);
  border: 2px solid var(--secondary);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  cursor: pointer;
}

.mg-bar-track {
  position: relative;
  width: 100%;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  margin-bottom: 1rem;
}

.mg-bar-green {
  position: absolute;
  left: 34%;
  width: 32%;
  top: 0;
  bottom: 0;
  background: rgba(46, 196, 182, 0.55);
  border: 2px solid #2ec4b6;
  border-radius: 999px;
}

.mg-bar-cursor {
  position: absolute;
  top: -4px;
  width: 10px;
  height: 36px;
  border-radius: 5px;
  background: var(--accent);
  transform: translateX(-50%);
}

.mg-break-btn {
  padding: 0.9rem 1.4rem;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #111;
  font-family: var(--font-display);
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.12s ease;
}

.mg-status {
  margin-top: 0.85rem;
  font-weight: 800;
  min-height: 1.4rem;
}

.mg-status.win { color: #2ec4b6; }
.mg-status.lose { color: #ff6b6b; }

/* Gallery */
.gallery-header {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 1rem;
}

.gallery-card {
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.gallery-card.unlocked {
  border-color: var(--card-accent, var(--secondary));
}

.gal-img-wrap {
  height: 180px;
  background: rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
}

.gal-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.gal-locked-icon {
  font-size: 2.5rem;
  opacity: 0.4;
}

.gal-info {
  padding: 0.95rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.gal-badges {
  display: flex;
  gap: 0.4rem;
  font-size: 0.74rem;
  font-weight: 700;
}

.gal-level {
  background: rgba(255, 255, 255, 0.12);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
}

.gal-maipu {
  background: var(--primary);
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
}

.gal-info p {
  font-size: 0.84rem;
  color: var(--text-muted);
}

.small-play-btn {
  margin-top: 0.35rem;
  padding: 0.45rem 0.8rem;
  border-radius: 10px;
  border: none;
  background: var(--secondary);
  color: #111;
  font-family: var(--font-display);
  font-weight: 800;
  cursor: pointer;
}

/* Estética única por artista: cada nivel transforma fondo, paleta, luces y textura */

body.theme-default {
  --bg-main: radial-gradient(circle at 20% 20%, #241038 0%, #0d0816 70%);
  --primary: #ff2e63;
  --secondary: #08d9d6;
  --accent: #ffe66d;
  --border-glow: rgba(8, 217, 214, 0.45);
}

/* 1. AKRILLA — Urbano / Callejero Maipú */
body.theme-akrilla {
  --bg-main: linear-gradient(135deg, #16071b 0%, #2a0a24 45%, #071b24 100%);
  --primary: #ff2e63;
  --secondary: #08d9d6;
  --accent: #eaeaea;
  --border-glow: rgba(255, 46, 99, 0.6);
  background-image: radial-gradient(rgba(8, 217, 214, 0.12) 1px, transparent 1px), var(--bg-main);
  background-size: 24px 24px, 100% 100%;
}

/* 2. Princesa Alba — Pop Urbano brillante */
body.theme-princesaalba {
  --bg-main: linear-gradient(135deg, #33092b 0%, #59114d 50%, #1c092b 100%);
  --primary: #ff66b3;
  --secondary: #ffe66d;
  --accent: #ffffff;
  --border-glow: rgba(255, 102, 179, 0.6);
}

body.theme-soulfia {
  --bg-main: radial-gradient(circle at top right, #3a125c 0%, #140c24 65%);
  --primary: #b565ff;
  --secondary: #ffd166;
  --accent: #f8edeb;
  --border-glow: rgba(181, 101, 255, 0.55);
}

/* 4. Ana Tijoux — Hip-Hop cálido / vinilo */
body.theme-anatijoux {
  --bg-main: linear-gradient(145deg, #21130b 0%, #3d1d0c 55%, #140d09 100%);
  --primary: #f77f00;
  --secondary: #fcbf49;
  --accent: #eae2b7;
  --border-glow: rgba(247, 127, 0, 0.55);
}

body.theme-javieramena {
  --bg-main: linear-gradient(160deg, #071329 0%, #180c36 55%, #07222b 100%);
  --primary: #f15bb5;
  --secondary: #00f5d4;
  --accent: #fee440;
  --border-glow: rgba(0, 245, 212, 0.55);
}

  --bg-main: linear-gradient(135deg, #240d1a 0%, #102038 100%);
  --primary: #ff4d6d;
  --secondary: #4cc9f0;
  --accent: #fff0f3;
  --border-glow: rgba(255, 77, 109, 0.55);
}

/* 7. Mon Laferte — Retro-Teatral */
body.theme-monlaferte {
  --bg-main: radial-gradient(circle at center, #3b0b12 0%, #170508 75%);
  --primary: #e63946;
  --secondary: #f4a261;
  --accent: #f1faee;
  --border-glow: rgba(230, 57, 70, 0.6);
}

/* 8. Rubio — Art-Pop Experimental */
body.theme-rubio {
  --bg-main: linear-gradient(145deg, #08121f 0%, #1d1033 60%, #071c21 100%);
  --primary: #9d4edd;
  --secondary: #72efdd;
  --accent: #e0aaff;
  --border-glow: rgba(114, 239, 221, 0.5);
}

body.theme-chinipng {
  --bg-main: linear-gradient(135deg, #161c18 0%, #262115 55%, #112422 100%);

  --secondary: #2ec4b6;

// --- soundEngine.js ---
// Motor de audio híbrido: carga /public/music/<artista>.mp3 si existe,
// o genera una pista musical dinámica con Web Audio API como respaldo inmediato.

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.paused = false;
    this.currentArtist = null;
    this.audioEl = null;
    this.usingMp3 = false;
    this.synthTimer = null;
    this.stepIndex = 0;
    this.volumeScale = 0.45;
  }

  ensureContext() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended' && !this.paused) {
      this.ctx.resume().catch(() => {});
    }
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.audioEl) {
      this.audioEl.muted = muted;
    }
  }

  setPhaseVolume(isRhythmPhase) {
    this.volumeScale = isRhythmPhase ? 0.72 : 0.36;
    if (this.audioEl) {
      this.audioEl.volume = this.volumeScale;
    }
  }

  playArtistTrack(artist, isRhythmPhase = false) {
    this.stopTrack();
    this.currentArtist = artist;
    this.setPhaseVolume(isRhythmPhase);
    this.ensureContext();

    const audio = new Audio(artist.files.audio);
    audio.loop = true;
    audio.volume = this.volumeScale;
    audio.muted = this.muted;

    let settled = false;
    const fallbackToSynth = () => {
      if (settled) return;
      settled = true;
      if (this.currentArtist?.id !== artist.id) return;
      this.usingMp3 = false;
      this.audioEl = null;
      this.startSynthLoop(artist);
    };

    audio.addEventListener(
      'canplaythrough',
      () => {
        if (settled) return;
        settled = true;
        if (this.currentArtist?.id !== artist.id) return;
        this.usingMp3 = true;
        this.audioEl = audio;
        if (!this.paused) {
          audio.play().catch(() => {
            this.usingMp3 = false;
            this.startSynthLoop(artist);
          });
        }
      },
      { once: true }
    );

    audio.addEventListener('error', fallbackToSynth, { once: true });
    audio.load();
  }

  startSynthLoop(artist) {
    if (this.synthTimer) clearInterval(this.synthTimer);
    this.stepIndex = 0;
    const stepMs = Math.round((60 / artist.synth.bpm / 2) * 1000);

    this.synthTimer = setInterval(() => {
      if (this.paused || this.muted || !this.ctx) return;
      this.playSynthStep(artist, this.stepIndex++);
    }, stepMs);
  }

  playSynthStep(artist, step) {
    const now = this.ctx.currentTime;
    const { scale, bassPattern, wave, style } = artist.synth;
    const vol = this.volumeScale * 0.22;

    // Kick en tiempos pares o patrón urbano
    const isKick = style === 'urban' ? step % 4 === 0 || step % 8 === 3 : step % 4 === 0;
    if (isKick) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(135, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.11);
      gain.gain.setValueAtTime(vol * 1.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // Snare / Clap en 2 y 6
    if (step % 4 === 2) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(style === 'urban' ? 240 : 190, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.07);
      gain.gain.setValueAtTime(vol * 0.85, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Bajo
    const bassFreq = bassPattern[step % bassPattern.length];
    if (bassFreq > 0) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(bassFreq, now);
      gain.gain.setValueAtTime(vol * 0.9, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.19);
    }

    // Melodía arpegiada
    if (step % 2 === 0 || (style === 'math' && step % 3 === 1)) {
      const noteFreq = scale[(step * 3 + Math.floor(step / 4)) % scale.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(noteFreq, now);
      gain.gain.setValueAtTime(vol * 0.48, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    }
  }

  pause() {
    this.paused = true;
    if (this.audioEl && !this.audioEl.paused) {
      this.audioEl.pause();
    }
    if (this.ctx && this.ctx.state === 'running') {
      this.ctx.suspend().catch(() => {});
    }
  }

  resume() {
    this.paused = false;
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    if (this.audioEl && this.usingMp3) {
      this.audioEl.play().catch(() => {});
    }
  }

  stopTrack() {
    if (this.synthTimer) {
      clearInterval(this.synthTimer);
      this.synthTimer = null;
    }
    if (this.audioEl) {
      this.audioEl.pause();
      this.audioEl.src = '';
      this.audioEl = null;
    }
    this.usingMp3 = false;
  }

  playSfx(type) {
    if (this.muted) return;
    this.ensureContext();
    const now = this.ctx.currentTime;

    const tone = (freqStart, freqEnd, duration, wave = 'sine', gainVal = 0.16, delay = 0) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freqStart, now + delay);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + delay + duration);
      gain.gain.setValueAtTime(gainVal, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + duration + 0.01);
    };

    switch (type) {
      case 'correct':
        tone(523.25, 659.25, 0.12, 'triangle', 0.18, 0);
        tone(659.25, 783.99, 0.16, 'triangle', 0.18, 0.09);
        break;
      case 'wrong':
        tone(220, 140, 0.18, 'sawtooth', 0.14, 0);
        break;
      case 'hit':
        tone(660, 880, 0.08, 'sine', 0.16, 0);
        break;
      case 'miss':
        tone(170, 95, 0.14, 'sawtooth', 0.15, 0);
        break;
      case 'dvd':
        tone(587.33, 880, 0.1, 'sine', 0.16, 0);
        tone(880, 1174.66, 0.16, 'sine', 0.16, 0.08);
        break;
      case 'win':
        tone(523.25, 523.25, 0.1, 'triangle', 0.18, 0);
        tone(659.25, 659.25, 0.1, 'triangle', 0.18, 0.1);
        tone(783.99, 1046.5, 0.25, 'triangle', 0.2, 0.2);
        break;
      case 'tick':
        tone(440, 440, 0.05, 'sine', 0.1, 0);
        break;
      default:
        break;
    }
  }
}

    <text x="200" y="328" font-family="sans-serif" font-size="15" font-weight="700" fill="${secondary}" text-anchor="middle">${artist.albumTitle.toUpperCase()}</text>
    <text x="200" y="356" font-family="sans-serif" font-size="12" fill="#ffffffaa" text-anchor="middle">${artist.genre}</text>
  </svg>`;
  return encodeSvg(svg);
}

function getFaceFallbackSvg(artist) {
  const { primary, secondary, bg } = artist.colors;
  const initials = artist.name
    .split(/[\s.]+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0].toUpperCase())
    .join('');

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
    <defs>
      <radialGradient id="f-${artist.id}" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="${primary}" />
        <stop offset="100%" stop-color="${bg}" />
      </radialGradient>
    </defs>
    <circle cx="90" cy="90" r="82" fill="url(#f-${artist.id})" stroke="${secondary}" stroke-width="6" />
    <circle cx="90" cy="76" r="32" fill="#ffe5d9" />
    <path d="M44 146 C44 114, 136 114, 136 146" fill="${secondary}" />
    <path d="M56 72 C56 40, 124 40, 124 72" fill="#1b1024" />
    <circle cx="78" cy="76" r="4" fill="#111" />
    <circle cx="102" cy="76" r="4" fill="#111" />
    <path d="M80 90 Q90 98 100 90" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" />
    <rect x="46" y="132" width="88" height="24" rx="12" fill="#000000aa" />
    <text x="90" y="149" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">${initials} • ${artist.symbols[0]}</text>
  </svg>`;
  return encodeSvg(svg);
}

function createArtistImage(src, fallbackSvg, alt, className = '') {
  const img = document.createElement('img');
  img.alt = alt;
  if (className) img.className = className;
  img.src = src;
  img.onerror = () => {
    if (img.src !== fallbackSvg) {
      img.src = fallbackSvg;
    }
  };
  return img;
}

// --- dvdFloater.js ---

const AURA_COLORS = ['#ff2e63', '#08d9d6', '#ffe66d', '#b565ff', '#00f5d4', '#ff9f1c'];

class DvdFloater {
  constructor({ layerEl, artist, isPausedFn, onShowFactModal }) {
    this.layerEl = layerEl;
    this.artist = artist;
    this.isPausedFn = isPausedFn;
    this.onShowFactModal = onShowFactModal;

    this.x = 40 + Math.random() * 160;
    this.y = 90 + Math.random() * 140;
    this.vx = (Math.random() > 0.5 ? 1 : -1) * 235;
    this.vy = (Math.random() > 0.5 ? 1 : -1) * 190;
    this.size = 88;
    this.colorIdx = 0;

    this.active = false;
    this.respawnRemainingMs = 0;
    this.rafId = null;
    this.lastTime = null;
    this.usedFactIndices = new Set();
    this.el = null;
  }

  start() {
    this.layerEl.classList.remove('hidden');
    this.spawn();
    this.lastTime = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - this.lastTime) / 1000);
      this.lastTime = now;
      this.tick(dt);
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  }

  spawn() {
    this.layerEl.innerHTML = '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dvd-face-btn';
    btn.title = `¡Atrapa a ${this.artist.name} para descubrir un Dato Curioso!`;

    const img = createArtistImage(
      this.artist.files.face,
      getFaceFallbackSvg(this.artist),
      `Rostro de ${this.artist.name}`,
      'dvd-face-img'
    );

    const badge = document.createElement('span');
    badge.className = 'dvd-badge';
    badge.textContent = '✨ ¡Dato!';

    btn.appendChild(img);
    btn.appendChild(badge);
    this.applyAuraColor(btn);

    btn.addEventListener('click', () => this.handleCatch());

    this.el = btn;
    this.layerEl.appendChild(btn);
    this.active = true;
    this.updatePosition();
  }

  applyAuraColor(el) {
    const color = AURA_COLORS[this.colorIdx % AURA_COLORS.length];
    el.style.setProperty('--dvd-aura', color);
  }

  tick(dt) {
    if (this.isPausedFn()) return;

    if (!this.active) {
      if (this.respawnRemainingMs > 0) {
        this.respawnRemainingMs -= dt * 1000;
        if (this.respawnRemainingMs <= 0) {
          this.respawnRemainingMs = 0;
          this.spawn();
        }
      }
      return;
    }

    if (!this.el) return;
    const maxW = window.innerWidth - this.size - 12;
    const minY = 74;
    const maxH = window.innerHeight - this.size - 12;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    let bounced = false;
    if (this.x <= 12) {
      this.x = 12;
      this.vx = Math.abs(this.vx);
      bounced = true;
    } else if (this.x >= maxW) {
      this.x = maxW;
      this.vx = -Math.abs(this.vx);
      bounced = true;
    }

    if (this.y <= minY) {
      this.y = minY;
      this.vy = Math.abs(this.vy);
      bounced = true;
    } else if (this.y >= maxH) {
      this.y = maxH;
      this.vy = -Math.abs(this.vy);
      bounced = true;
    }

    if (bounced) {
      this.colorIdx = (this.colorIdx + 1) % AURA_COLORS.length;
      this.applyAuraColor(this.el);
    }

    this.updatePosition();
  }

  updatePosition() {
    if (this.el) {
      this.el.style.transform = `translate3d(${Math.round(this.x)}px, ${Math.round(this.y)}px, 0)`;
    }
  }

  getNextFact() {
    const list = FACTS[this.artist.id] || [];
    if (list.length === 0) return 'Artista destacada por romper barreras en la industria musical.';
    if (this.usedFactIndices.size >= list.length) {
      this.usedFactIndices.clear();
    }
    const available = list.map((_, idx) => idx).filter((idx) => !this.usedFactIndices.has(idx));
    const chosenIdx = available[Math.floor(Math.random() * available.length)];
    this.usedFactIndices.add(chosenIdx);
    return list[chosenIdx];
  }

  handleCatch() {
    if (!this.active || this.isPausedFn()) return;
    this.active = false;
    this.layerEl.innerHTML = '';
    this.el = null;
    soundEngine.playSfx('dvd');

    const fact = this.getNextFact();
    this.onShowFactModal(fact, () => {
      // Al cerrar el modal, inicia contador interno de 10 segundos para reaparecer
      this.respawnRemainingMs = 10000;
    });
  }

  destroy() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
    this.active = false;
    this.layerEl.innerHTML = '';
    this.layerEl.classList.add('hidden');
  }
}

const WILDCARD_DEFS = [
  {
    id: 'share',
    name: 'Compartir',
    effectLabel: 'Pista extra / Escudo',
    icon: '📤',
    minigameTitle: '¡Atrapa 3 íconos musicales!',
    minigameDesc: 'Haz clic en 3 notas que caen antes de que se acabe el tiempo (5s).',
  },
  {
    id: 'playlist',
    name: 'Agregar a Playlist',
    effectLabel: 'Elimina 2 opciones',
    icon: '➕',
    minigameTitle: '¡Detén la barra en la zona verde!',
    minigameDesc: 'Presiona "¡DETENER!" cuando el marcador pase por el centro verde (4s).',
  },
  {
    id: 'stream',
    name: 'Stremear',
    effectLabel: 'Puntos x2',
    icon: '🎧',
    minigameTitle: '¡Rompe el Algoritmo!',
    minigameDesc: 'Haz clic 3 veces seguidas en el botón antes de que desaparezca (4.5s).',
  },
];

function openWildcardMinigame(wildcardId, modalOverlay, isPausedFn, onResult) {
  const def = WILDCARD_DEFS.find((w) => w.id === wildcardId);
  if (!def) return;

  modalOverlay.classList.remove('hidden');
  modalOverlay.innerHTML = `
    <div class="modal-card wildcard-modal">
      <div class="wildcard-badge">${def.icon} ${def.name} — ${def.effectLabel}</div>
      <h2>${def.minigameTitle}</h2>
      <p>${def.minigameDesc}</p>
      <div class="mg-timer-bar"><div id="mg-timer-fill" class="mg-timer-fill"></div></div>
      <div id="mg-arena" class="mg-arena"></div>
      <div id="mg-status" class="mg-status"></div>
    </div>
  `;

  const arena = modalOverlay.querySelector('#mg-arena');
  const timerFill = modalOverlay.querySelector('#mg-timer-fill');
  const statusEl = modalOverlay.querySelector('#mg-status');

  let finished = false;
  const finish = (won) => {
    if (finished) return;
    finished = true;
    soundEngine.playSfx(won ? 'win' : 'wrong');
    statusEl.textContent = won
      ? `✅ ¡Logrado! Activaste: ${def.effectLabel}`
      : '😅 ¡Casi! No se activó esta vez.';
    statusEl.className = `mg-status ${won ? 'win' : 'lose'}`;
    setTimeout(() => {
      modalOverlay.classList.add('hidden');
      modalOverlay.innerHTML = '';
      onResult(won);
    }, 900);
  };

  const durationMs = wildcardId === 'share' ? 5000 : wildcardId === 'playlist' ? 4000 : 4500;
  let elapsed = 0;
  let last = performance.now();

  const tickTimer = (now) => {
    if (finished) return;
    const dt = now - last;
    last = now;
    if (!isPausedFn()) {
      elapsed += dt;
      const pct = Math.max(0, 100 - (elapsed / durationMs) * 100);
      timerFill.style.width = `${pct}%`;
      if (elapsed >= durationMs) {
        finish(false);
        return;
      }
    }
    requestAnimationFrame(tickTimer);
  };
  requestAnimationFrame(tickTimer);

  if (wildcardId === 'share') {
    runCatchMinigame(arena, isPausedFn, () => finish(true));
  } else if (wildcardId === 'playlist') {
    runTimingBarMinigame(arena, isPausedFn, (won) => finish(won));
  } else {
    runBreakAlgorithmMinigame(arena, isPausedFn, () => finish(true));
  }
}

function runCatchMinigame(arena, isPausedFn, onWin) {
  let caught = 0;
  arena.innerHTML = `
    <div class="mg-catch-counter">Atrapados: <strong id="mg-caught">0</strong> / 3</div>
    <div id="mg-drop-zone" class="mg-drop-zone"></div>
  `;
  const counterEl = arena.querySelector('#mg-caught');
  const zone = arena.querySelector('#mg-drop-zone');
  const icons = ['🎵', '🎧', '🎤', '💿', '✨'];

  const spawnIcon = () => {
    if (!arena.isConnected) return;
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'mg-falling-icon';
    item.textContent = icons[Math.floor(Math.random() * icons.length)];
    item.style.left = `${10 + Math.random() * 78}%`;
    item.style.top = '-20px';

    let y = -20;
    const speed = 75 + Math.random() * 45;
    let alive = true;

    item.addEventListener('click', () => {
      if (!alive || isPausedFn()) return;
      alive = false;
      item.remove();
      caught += 1;
      counterEl.textContent = String(caught);
      soundEngine.playSfx('hit');
      if (caught >= 3) {
        onWin();
      }
    });

    zone.appendChild(item);

    let last = performance.now();
    const fall = (now) => {
      if (!alive || !item.isConnected) return;
      const dt = (now - last) / 1000;
      last = now;
      if (!isPausedFn()) {
        y += speed * dt;
        item.style.top = `${y}px`;
        if (y > 170) {
          alive = false;
          item.remove();
          return;
        }
      }
      requestAnimationFrame(fall);
    };
    requestAnimationFrame(fall);
  };

  spawnIcon();
  const spawner = setInterval(() => {
    if (!arena.isConnected) {
      clearInterval(spawner);
      return;
    }
    if (!isPausedFn()) spawnIcon();
  }, 650);
}

function runTimingBarMinigame(arena, isPausedFn, onDone) {
  arena.innerHTML = `
    <div class="mg-bar-track">
      <div class="mg-bar-green"></div>
      <div id="mg-bar-cursor" class="mg-bar-cursor"></div>
    </div>
    <button id="mg-stop-btn" type="button" class="primary-btn">¡DETENER!</button>
  `;
  const cursor = arena.querySelector('#mg-bar-cursor');
  const stopBtn = arena.querySelector('#mg-stop-btn');

  let pos = 10;
  let dir = 1;
  let stopped = false;
  let last = performance.now();

  const move = (now) => {
    if (stopped || !arena.isConnected) return;
    const dt = (now - last) / 1000;
    last = now;
    if (!isPausedFn()) {
      pos += dir * 135 * dt;
      if (pos >= 95) {
        pos = 95;
        dir = -1;
      } else if (pos <= 5) {
        pos = 5;
        dir = 1;
      }
      cursor.style.left = `${pos}%`;
    }
    requestAnimationFrame(move);
  };
  requestAnimationFrame(move);

  stopBtn.addEventListener('click', () => {
    if (stopped || isPausedFn()) return;
    stopped = true;
    const won = pos >= 34 && pos <= 66;
    onDone(won);
  });
}

function runBreakAlgorithmMinigame(arena, isPausedFn, onWin) {
  let clicks = 0;
  arena.innerHTML = `
    <div class="mg-catch-counter">Clics: <strong id="mg-clicks">0</strong> / 3</div>
    <button id="mg-break-btn" type="button" class="mg-break-btn">⚡ ROMPER ALGORITMO</button>
  `;
  const clicksEl = arena.querySelector('#mg-clicks');
  const btn = arena.querySelector('#mg-break-btn');

  btn.addEventListener('click', () => {
    if (isPausedFn()) return;
    clicks += 1;
    clicksEl.textContent = String(clicks);
    soundEngine.playSfx('hit');
    btn.style.transform = `translate(${Math.round((Math.random() - 0.5) * 80)}px, ${Math.round((Math.random() - 0.5) * 35)}px)`;
    if (clicks >= 3) {
      onWin();
    }
  });
}

// --- phase1.js ---

class Phase1Controller {
  constructor({
    container,
    dvdLayer,
    modalOverlay,
    artist,
    answeredIds,
    isPausedFn,
    onVisibilityChange,
    onShowModal,
    onComplete,
  }) {
    this.container = container;
    this.dvdLayer = dvdLayer;
    this.modalOverlay = modalOverlay;
    this.artist = artist;
    this.answeredIds = answeredIds;
    this.isPausedFn = isPausedFn;
    this.onVisibilityChange = onVisibilityChange;
    this.onShowModal = onShowModal;
    this.onComplete = onComplete;

    this.questions = (QUESTIONS[artist.id] || []).filter((q) => !answeredIds.has(q.id));
    if (this.questions.length === 0) {
      this.questions = [...(QUESTIONS[artist.id] || [])];
    }

    this.qIndex = 0;
    this.visibility = 0;
    this.visibilityGoal = 350;

    // Estado por pregunta
    this.attemptsUsed = 0;
    this.eliminatedOptions = new Set();
    this.shieldActive = false;
    this.doublePointsActive = false;
    this.questionLocked = false;

    // Comodines: se habilitan después de 30s en el nivel
    this.wildcardCooldownSec = 30;
    this.usedWildcards = new Set();
    this.cooldownTimer = null;

    this.dvdFloater = null;
  }

  start() {
    this.onVisibilityChange(this.visibility, this.visibilityGoal);
    this.render();
    this.startWildcardCooldown();

    this.dvdFloater = new DvdFloater({
      layerEl: this.dvdLayer,
      artist: this.artist,
      isPausedFn: this.isPausedFn,
      onShowFactModal: (fact, onClose) => {
        this.addVisibility(35);
        this.onShowModal({
          badge: `✨ Dato Curioso Real • ${this.artist.name}`,
          title: '¡Atrapaste el rostro luminoso! (+35 Visibilidad)',
          body: `<p class="fact-text">${fact}</p>`,
          buttonText: '¡Genial, seguir jugando!',
          onClose,
        });
      },
    });
    this.dvdFloater.start();
  }

  startWildcardCooldown() {
    if (this.cooldownTimer) clearInterval(this.cooldownTimer);
    this.cooldownTimer = setInterval(() => {
      if (this.isPausedFn()) return;
      if (this.wildcardCooldownSec > 0) {
        this.wildcardCooldownSec -= 1;
        this.updateWildcardButtons();
        if (this.wildcardCooldownSec === 0) {
          clearInterval(this.cooldownTimer);
          this.cooldownTimer = null;
        }
      }
    }, 1000);
  }

  addVisibility(amount) {
    this.visibility += amount;
    this.onVisibilityChange(this.visibility, this.visibilityGoal);
  }

  render() {
    const q = this.questions[this.qIndex];
    if (!q) {
      this.finishPhase();
      return;
    }

    const maipuBanner = this.artist.isMaipuLocal
      ? `<div class="maipu-spotlight">📍 PROTAGONISTA LOCAL: Orgullo de Maipú — la misma comuna de nuestro colegio</div>`
      : '';

    this.container.innerHTML = `
      <div class="phase1-layout">
        <aside class="artist-stage-card">
          <div class="decor-chip">${this.artist.decorLabel}</div>
          <div id="artist-photo-slot" class="artist-photo-frame"></div>
          <div class="artist-meta">
            <h2>${this.artist.name}</h2>
            <p class="artist-origin">${this.artist.origin} • ${this.artist.genre}</p>
            <p class="artist-tagline">${this.artist.tagline}</p>
            <div class="symbol-row">${this.artist.symbols.map((s) => `<span>${s}</span>`).join('')}</div>
          </div>
        </aside>

        <section class="question-panel">
          ${maipuBanner}
          <div class="question-header">
            <span class="q-counter">Desafío ${this.qIndex + 1} de ${this.questions.length}</span>
            <span class="q-no-timer">🕊️ Sin límite de tiempo — lee con calma</span>
          </div>

          <div class="context-box">
            <div class="box-label">💡 Contexto / Pista</div>
            <p>${q.context}</p>
            <div id="extra-hint-box" class="extra-hint ${this.shieldActive ? '' : 'hidden'}">
              🛡️ <strong>Pista / Escudo activo:</strong> Tu próximo intento está protegido y la respuesta correcta habla de romper sesgos o dar visibilidad real.
            </div>
          </div>

          <div class="question-box">
            <div class="box-label">❓ Pregunta directa</div>
            <h3>${q.question}</h3>
            <div id="active-buffs" class="active-buffs">
              ${this.doublePointsActive ? '<span class="buff-pill">🎧 Puntos x2 activo</span>' : ''}
              ${this.shieldActive ? '<span class="buff-pill">📤 Escudo activo</span>' : ''}
            </div>
            <div id="options-list" class="options-list"></div>
            <div id="q-feedback" class="q-feedback hidden"></div>
          </div>

          <div class="wildcards-bar">
            <div class="wildcards-title">⚡ Comodines estratégicos (1 uso por nivel):</div>
            <div id="wildcards-grid" class="wildcards-grid"></div>
          </div>
        </section>
      </div>
    `;

    const photoSlot = this.container.querySelector('#artist-photo-slot');
    photoSlot.appendChild(
      createArtistImage(
        this.artist.files.photo,
        getPhotoFallbackSvg(this.artist),
        this.artist.name,
        'artist-photo-img'
      )
    );

    this.renderOptions(q);
    this.updateWildcardButtons();
  }

  renderOptions(q) {
    const list = this.container.querySelector('#options-list');
    list.innerHTML = '';

    q.options.forEach((optText, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option-btn';
      btn.dataset.index = String(idx);
      btn.innerHTML = `<span class="opt-letter">${String.fromCharCode(65 + idx)}</span><span>${optText}</span>`;

      if (this.eliminatedOptions.has(idx)) {
        btn.disabled = true;
        btn.classList.add('eliminated');
      }

      btn.addEventListener('click', () => this.handleOptionClick(idx, btn));
      list.appendChild(btn);
    });
  }

  handleOptionClick(idx, btn) {
    if (this.questionLocked || this.isPausedFn()) return;
    const q = this.questions[this.qIndex];
    const feedbackEl = this.container.querySelector('#q-feedback');

    if (idx === q.correctIndex) {
      this.questionLocked = true;
      btn.classList.add('correct');
      soundEngine.playSfx('correct');

      let pts = this.attemptsUsed === 0 ? 100 : 70;
      if (this.doublePointsActive) pts *= 2;

      this.answeredIds.add(q.id);
      this.addVisibility(pts);

      feedbackEl.className = 'q-feedback success';
      feedbackEl.innerHTML = `✅ ${q.feedback} <strong>(+${pts} Visibilidad)</strong>`;
      feedbackEl.classList.remove('hidden');

      setTimeout(() => this.advanceQuestion(), 1450);
    } else {
      soundEngine.playSfx('wrong');
      this.eliminatedOptions.add(idx);
      btn.disabled = true;
      btn.classList.add('wrong');

      if (this.attemptsUsed === 0) {
        this.attemptsUsed = 1;
        feedbackEl.className = 'q-feedback retry';
        feedbackEl.textContent = this.shieldActive
          ? '🛡️ ¡Escudo usado! ¡Casi! Inténtalo de nuevo con las opciones restantes.'
          : '😅 ¡Casi! Inténtalo de nuevo (segunda oportunidad).';
        feedbackEl.classList.remove('hidden');
      } else {
        // Segundo fallo: mostrar respuesta correcta y avanzar
        this.questionLocked = true;
        const correctBtn = this.container.querySelector(`.option-btn[data-index="${q.correctIndex}"]`);
        if (correctBtn) correctBtn.classList.add('correct');

        const effortPts = this.shieldActive ? 70 : 45;
        this.answeredIds.add(q.id);
        this.addVisibility(effortPts);

        feedbackEl.className = 'q-feedback info';
        feedbackEl.innerHTML = `💡 Respuesta correcta marcada arriba. ${q.feedback} <strong>(+${effortPts} Visibilidad por aprender)</strong>`;
        feedbackEl.classList.remove('hidden');

        setTimeout(() => this.advanceQuestion(), 2100);
      }
    }
  }

  advanceQuestion() {
    this.qIndex += 1;
    this.attemptsUsed = 0;
    this.eliminatedOptions.clear();
    this.shieldActive = false;
    this.doublePointsActive = false;
    this.questionLocked = false;
    this.render();
  }

  updateWildcardButtons() {
    const grid = this.container.querySelector('#wildcards-grid');
    if (!grid) return;
    grid.innerHTML = '';

    WILDCARD_DEFS.forEach((wc) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const used = this.usedWildcards.has(wc.id);
      const locked = this.wildcardCooldownSec > 0;
      btn.className = `wildcard-btn ${used ? 'used' : locked ? 'charging' : 'ready'}`;
      btn.disabled = used || locked || this.questionLocked;

      let statusText = wc.effectLabel;
      if (used) statusText = 'Usado en este nivel';
      else if (locked) statusText = `⏳ Disponible en ${this.wildcardCooldownSec}s`;

      btn.innerHTML = `
        <span class="wc-icon">${wc.icon}</span>
        <span class="wc-text">
          <strong>${wc.name}</strong>
          <small>${statusText}</small>
        </span>
      `;

      btn.addEventListener('click', () => this.activateWildcard(wc.id));
      grid.appendChild(btn);
    });
  }

  activateWildcard(wildcardId) {
    if (this.wildcardCooldownSec > 0 || this.usedWildcards.has(wildcardId) || this.questionLocked) return;
    this.usedWildcards.add(wildcardId);
    this.updateWildcardButtons();

    openWildcardMinigame(wildcardId, this.modalOverlay, this.isPausedFn, (won) => {
      if (!won) return;
      if (wildcardId === 'share') {
        this.shieldActive = true;
      } else if (wildcardId === 'stream') {
        this.doublePointsActive = true;
      } else if (wildcardId === 'playlist') {
        const q = this.questions[this.qIndex];
        const wrongIndices = [0, 1, 2, 3].filter(
          (i) => i !== q.correctIndex && !this.eliminatedOptions.has(i)
        );
        wrongIndices.slice(0, 2).forEach((i) => this.eliminatedOptions.add(i));
      }
      this.render();
    });
  }

  finishPhase() {
    this.destroy();
    this.onComplete(this.visibility);
  }

  destroy() {
    if (this.cooldownTimer) {
      clearInterval(this.cooldownTimer);
      this.cooldownTimer = null;
    }
    if (this.dvdFloater) {
      this.dvdFloater.destroy();
      this.dvdFloater = null;
    }
  }
}

const LANES = [
  { key: 'a', label: 'A', hand: 'Izq' },
  { key: 's', label: 'S', hand: 'Izq' },
  { key: 'k', label: 'K', hand: 'Der' },
  { key: 'l', label: 'L', hand: 'Der' },
];

class Phase2Controller {
  constructor({ container, artist, isPausedFn, onSuccess, onRetryNeeded }) {
    this.container = container;
    this.artist = artist;
    this.isPausedFn = isPausedFn;
    this.onSuccess = onSuccess;
    this.onRetryNeeded = onRetryNeeded;

    this.trackHeight = 420;
    this.hitLineY = 355;
    this.hitWindowPx = 52; // Margen generoso para 12-13 años

    this.notes = [];
    this.nextNoteId = 1;
    this.hits = 0;
    this.misses = 0;
    this.falsePresses = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.score = 0;

    this.countdownSec = 3;
    this.songElapsedMs = 0;
    this.songDurationMs = artist.rhythm.durationSec * 1000;
    this.spawnAccumMs = 0;
    this.rafId = null;
    this.lastTime = null;
    this.finished = false;
    this.countdownTimer = null;

    this.handleKeyDown = this.handleKeyDown.bind(this);
  }

  start() {
    this.render();
    window.addEventListener('keydown', this.handleKeyDown);
    this.startCountdown();
  }

  render() {
    const minPct = this.artist.rhythm.minApprovalPct;
    this.container.innerHTML = `
      <div class="phase2-layout">
        <div class="rhythm-sidebar">
          <div id="rhythm-art" class="rhythm-art-box"></div>
          <h3>${this.artist.name}</h3>
          <p class="rhythm-song-tag">🎵 ${this.artist.albumTitle}</p>
          <div class="rhythm-stats">
            <div class="stat-box"><span>Combo</span><strong id="r-combo">0</strong></div>
            <div class="stat-box"><span>Aciertos</span><strong id="r-hits">0</strong></div>
            <div class="stat-box"><span>Errores</span><strong id="r-errors">0</strong></div>
          </div>
          <div class="approval-box">
            <div class="approval-labels">
              <span>Aprobación</span>
              <span id="r-approval-text">100% (Meta: ${minPct}%)</span>
            </div>
            <div class="approval-bar">
              <div id="r-approval-fill" class="approval-fill" style="width: 100%"></div>
              <div class="approval-target-line" style="left: ${minPct}%"></div>
            </div>
          </div>
          <div class="song-time-wrap">
            <span>⏱️ Tiempo restante: <strong id="r-time-left">${this.artist.rhythm.durationSec}s</strong></span>
          </div>
          <div id="r-feedback-banner" class="r-feedback-banner">Prepárate...</div>
        </div>

        <div class="rhythm-board-wrap">
          <div id="rhythm-countdown" class="rhythm-countdown">3</div>
          <div id="rhythm-track" class="rhythm-track" style="height: ${this.trackHeight}px">
            <div class="hit-zone-bar" style="top: ${this.hitLineY - 22}px"></div>
            <div class="lanes-grid">
              ${LANES.map(
                (lane, i) => `
                <div class="lane" data-lane="${i}">
                  <div class="lane-notes" id="lane-notes-${i}"></div>
                  <button type="button" class="lane-receptor" data-lane="${i}">
                    <span class="key-cap">${lane.label}</span>
                    <small>${lane.hand}</small>
                  </button>
                </div>`
              ).join('')}
            </div>
          </div>
        </div>
      </div>
    `;

    const artBox = this.container.querySelector('#rhythm-art');
    artBox.appendChild(
      createArtistImage(
        this.artist.files.photo,
        getPhotoFallbackSvg(this.artist),
        this.artist.name,
        'rhythm-art-img'
      )
    );

    this.container.querySelectorAll('.lane-receptor').forEach((btn) => {
      btn.addEventListener('pointerdown', () => {
        const laneIdx = Number(btn.dataset.lane);
        this.triggerLane(laneIdx);
      });
    });
  }

  startCountdown() {
    const cdEl = this.container.querySelector('#rhythm-countdown');
    soundEngine.playSfx('tick');

    this.countdownTimer = setInterval(() => {
      if (this.isPausedFn() || this.finished) return;
      this.countdownSec -= 1;
      if (this.countdownSec > 0) {
        cdEl.textContent = String(this.countdownSec);
        soundEngine.playSfx('tick');
      } else if (this.countdownSec === 0) {
        cdEl.textContent = '¡SUENA!';
        soundEngine.playSfx('win');
      } else {
        clearInterval(this.countdownTimer);
        this.countdownTimer = null;
        cdEl.classList.add('hidden');
        this.setFeedback('¡Toca A - S - K - L al ritmo!', 'neutral');
        this.startLoop();
      }
    }, 850);
  }

  startLoop() {
    this.lastTime = performance.now();
    const loop = (now) => {
      if (this.finished) return;
      const dtMs = Math.min(50, now - this.lastTime);
      this.lastTime = now;

      if (!this.isPausedFn()) {
        this.update(dtMs);
      }
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  }

  update(dtMs) {
    const dtSec = dtMs / 1000;
    this.songElapsedMs += dtMs;

    // Dejar de spawnear notas en los últimos 2.2 segundos para que terminen de caer
    if (this.songElapsedMs < this.songDurationMs - 2200) {
      this.spawnAccumMs += dtMs;
      if (this.spawnAccumMs >= this.artist.rhythm.spawnIntervalMs) {
        this.spawnAccumMs -= this.artist.rhythm.spawnIntervalMs;
        this.spawnNote();
      }
    }

    const speed = this.artist.rhythm.speedPxPerSec;
    for (let i = this.notes.length - 1; i >= 0; i--) {
      const note = this.notes[i];
      note.y += speed * dtSec;
      note.el.style.transform = `translateY(${Math.round(note.y)}px)`;

      if (note.y > this.hitLineY + this.hitWindowPx + 18) {
        note.el.remove();
        this.notes.splice(i, 1);
        this.misses += 1;
        this.combo = 0;
        this.setFeedback('Nota perdida', 'bad');
        this.updateHud();
      }
    }

    const timeLeft = Math.max(0, Math.ceil((this.songDurationMs - this.songElapsedMs) / 1000));
    const timeEl = this.container.querySelector('#r-time-left');
    if (timeEl) timeEl.textContent = `${timeLeft}s`;

    if (this.songElapsedMs >= this.songDurationMs && this.notes.length === 0) {
      this.finishSong();
    }
  }

  spawnNote() {
    const laneIdx = Math.floor(Math.random() * LANES.length);
    const laneContainer = this.container.querySelector(`#lane-notes-${laneIdx}`);
    if (!laneContainer) return;

    const el = document.createElement('div');
    el.className = `rhythm-note lane-color-${laneIdx}`;
    el.textContent = LANES[laneIdx].label;
    laneContainer.appendChild(el);

    this.notes.push({
      id: this.nextNoteId++,
      lane: laneIdx,
      y: -36,
      el,
    });
  }

  handleKeyDown(e) {
    if (this.isPausedFn() || this.finished || this.countdownSec >= 0) return;
    const key = e.key.toLowerCase();
    const laneIdx = LANES.findIndex((l) => l.key === key);
    if (laneIdx !== -1) {
      e.preventDefault();
      this.triggerLane(laneIdx);
    }
  }

  triggerLane(laneIdx) {
    if (this.isPausedFn() || this.finished || this.countdownSec >= 0) return;

    const laneEl = this.container.querySelector(`.lane[data-lane="${laneIdx}"]`);
    const receptor = laneEl?.querySelector('.lane-receptor');

    // Buscar nota más cercana dentro de la zona de acierto en este carril
    let bestIdx = -1;
    let bestDist = Infinity;
    for (let i = 0; i < this.notes.length; i++) {
      const n = this.notes[i];
      if (n.lane !== laneIdx) continue;
      const dist = Math.abs(n.y - this.hitLineY);
      if (dist <= this.hitWindowPx && dist < bestDist) {
        bestDist = dist;
        bestIdx = i;
      }
    }

    if (bestIdx !== -1) {
      const hitNote = this.notes[bestIdx];
      hitNote.el.remove();
      this.notes.splice(bestIdx, 1);

      this.hits += 1;
      this.combo += 1;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.score += 100 + this.combo * 10;

      soundEngine.playSfx('hit');
      receptor?.classList.add('hit-flash');
      setTimeout(() => receptor?.classList.remove('hit-flash'), 140);

      this.setFeedback(bestDist < 22 ? '🔥 ¡PERFECTO!' : '✨ ¡BIEN!', 'good');
      this.updateHud();
    } else {
      // Penalización anti-machaqueo por tocar a destiempo
      this.falsePresses += 1;
      this.combo = 0;
      this.score = Math.max(0, this.score - 30);

      soundEngine.playSfx('miss');
      laneEl?.classList.add('error-flash');
      receptor?.classList.add('error-flash');
      setTimeout(() => {
        laneEl?.classList.remove('error-flash');
        receptor?.classList.remove('error-flash');
      }, 220);

      this.setFeedback('❌ ¡A destiempo! Solo toca cuando haya nota', 'bad');
      this.updateHud();
    }
  }

  getApprovalPct() {
    const totalAttempts = this.hits + this.misses + this.falsePresses;
    if (totalAttempts === 0) return 100;
    return Math.round((this.hits / totalAttempts) * 100);
  }

  updateHud() {
    const comboEl = this.container.querySelector('#r-combo');
    const hitsEl = this.container.querySelector('#r-hits');
    const errEl = this.container.querySelector('#r-errors');
    const appText = this.container.querySelector('#r-approval-text');
    const appFill = this.container.querySelector('#r-approval-fill');

    const pct = this.getApprovalPct();
    const minPct = this.artist.rhythm.minApprovalPct;

    if (comboEl) comboEl.textContent = String(this.combo);
    if (hitsEl) hitsEl.textContent = String(this.hits);
    if (errEl) errEl.textContent = String(this.misses + this.falsePresses);
    if (appText) appText.textContent = `${pct}% (Meta: ${minPct}%)`;
    if (appFill) {
      appFill.style.width = `${pct}%`;
      appFill.classList.toggle('passing', pct >= minPct);
      appFill.classList.toggle('failing', pct < minPct);
    }
  }

  setFeedback(text, kind) {
    const el = this.container.querySelector('#r-feedback-banner');
    if (!el) return;
    el.textContent = text;
    el.className = `r-feedback-banner ${kind}`;
  }

  finishSong() {
    this.finished = true;
    this.cleanupListeners();

    const pct = this.getApprovalPct();
    const minPct = this.artist.rhythm.minApprovalPct;
    const totalAttempts = this.hits + this.misses + this.falsePresses;

    if (pct >= minPct) {
      soundEngine.playSfx('win');
      this.onSuccess({
        approvalPct: pct,
        hits: this.hits,
        maxCombo: this.maxCombo,
        score: this.score,
      });
    } else {
      soundEngine.playSfx('wrong');
      const neededHits = Math.max(1, Math.ceil((minPct / 100) * totalAttempts) - this.hits);
      this.onRetryNeeded({
        approvalPct: pct,
        minPct,
        neededHits,
        hits: this.hits,
        errors: this.misses + this.falsePresses,
      });
    }
  }

  cleanupListeners() {
    window.removeEventListener('keydown', this.handleKeyDown);
    if (this.countdownTimer) {
      clearInterval(this.countdownTimer);
      this.countdownTimer = null;
    }
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
  }

  destroy() {
    this.finished = true;
    this.cleanupListeners();
  }
}
